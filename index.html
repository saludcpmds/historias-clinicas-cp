<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirección de Asistencia y Tratamiento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN -->
    <div id="loginSection" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-emerald-600">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Dirección de Asistencia y Tratamiento</h1>
            <p class="text-gray-500 text-sm">Historias Clínicas</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" id="loginEmail" value="armandojara07@gmail.com" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-emerald-500 focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="loginPassword" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-emerald-500 focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-md hover:bg-emerald-700 font-semibold transition duration-200">Iniciar Sesión</button>
        </form>
        <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
    </div>

    <!-- SECCIÓN CLÍNICA (CARGA Y BÚSQUEDA) -->
    <div id="clinicalSection" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-3xl hidden border-t-4 border-emerald-600 space-y-8">
        <div class="flex justify-between items-center border-b pb-4">
            <div>
                <h2 class="text-xl font-bold text-gray-800">Sistema Informático de Historias Clínicas</h2>
                <p id="userEmail" class="text-xs text-gray-500"></p>
            </div>
            <button id="logoutBtn" class="text-xs bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600 transition">Cerrar Sesión</button>
        </div>

        <!-- BUSCADOR POR DNI -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
            <h3 class="text-md font-semibold text-gray-700 mb-2">Buscar Paciente por DNI</h3>
            <div class="flex gap-2">
                <input type="text" id="buscarDNI" placeholder="Ingrese número de DNI" class="flex-1 px-3 py-2 border rounded-md focus:ring-emerald-500 focus:border-emerald-500">
                <button id="btnBuscar" class="bg-slate-800 text-white px-4 py-2 rounded-md hover:bg-slate-900 font-semibold transition">Buscar</button>
            </div>
            <div id="resultadoBusqueda" class="mt-4"></div>
        </div>

        <!-- FORMULARIO DE CARGA DE HISTORIA CLÍNICA -->
        <div class="border-t pt-6">
            <h3 class="text-md font-semibold text-gray-700 mb-4">Nueva Historia Clínica</h3>
            <form id="clinicalForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">DNI Paciente</label>
                        <input type="text" id="pacienteDni" required class="mt-1 block w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" id="pacienteNombre" required class="mt-1 block w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Apellido</label>
                        <input type="text" id="pacienteApellido" required class="mt-1 block w-full px-3 py-2 border rounded-md">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Motivo de Consulta</label>
                    <textarea id="motivoConsulta" rows="2" required class="mt-1 block w-full px-3 py-2 border rounded-md"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Diagnóstico (CIE-11)</label>
                    <input type="text" id="diagnosticoCie11" placeholder="Ej: CA40.0" class="mt-1 block w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Observaciones Epidemiológicas</label>
                    <textarea id="observaciones" rows="3" class="mt-1 block w-full px-3 py-2 border rounded-md"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-md hover:bg-emerald-700 font-semibold transition">Guardar Historia Clínica</button>
            </form>
            <p id="clinicalStatus" class="text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
